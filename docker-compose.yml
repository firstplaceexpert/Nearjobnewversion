services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nearjob-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nearjob_user}:${POSTGRES_PASSWORD:-nearjob_password}@db:5432/${POSTGRES_DB:-nearjob}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-production-secret-must-be-changed-min-32-chars}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: nearjob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nearjob_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nearjob_password}
      POSTGRES_DB: ${POSTGRES_DB:-nearjob}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nearjob_user} -d ${POSTGRES_DB:-nearjob}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
